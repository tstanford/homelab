apiVersion: v1
kind: Namespace
metadata:
  name: hello
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloapi
  namespace: hello
spec:
  replicas: 3
  selector:
    matchLabels:
      app: helloapi
  template:
    metadata:
      labels:
        app: helloapi
    spec:
      containers:
        - name: helloapi
          image: tjstanford/helloapi
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: helloapi-service
  namespace: hello
spec:
  selector:
    app: helloapi
  type: LoadBalancer
  loadBalancerIP: 192.168.0.59
  ports:
    - port: 80
      targetPort: 3000