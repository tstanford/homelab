apiVersion: v1
kind: Namespace
metadata:
  name: test
---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: testapi
  namespace: test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: testapi
  template:
    metadata:
      labels:
        app: testapi
    spec:
      containers:
        - name: testapi
          image: tjstanford/myimage:1.0.0
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: testapi-service
  namespace: test
spec:
  selector:
    app: testapi
  type: LoadBalancer
  loadBalancerIP: 192.168.0.58
  ports:
    - port: 80
      targetPort: 3000