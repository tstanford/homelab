- name: disable swap on vms
  hosts: k3s-cluster
  become: true
  tasks:
    - name: disable swap
      shell: swapoff -a

    - name: disable swap in fstab
      shell: sed -i '/swap/ s/^[^#]/#&/' /etc/fstab

- name: make sure we log to ram to not kill ssd
  hosts: k3s-cluster
  become: true
  tasks:

    - name: install prerequisites
      apt:
        pkg:
          - wget
          - curl

    - name: install log2ram package
      apt:
        pkg:
          - log2ram
        state: latest
        update_cache: true
      register: update_result

    - name: reboot vms
      reboot:
        msg: "Reboot initiated by Ansible due to updates."
      when: update_result.changed